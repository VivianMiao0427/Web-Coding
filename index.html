<!DOCTYPE html>
<html>
<head>
  <title>My Diary</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(to bottom, #8fd6f0, #1c7fb0);
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 40px;
    }

    .entries {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
    }

    .entry-card {
      display: block;
      width: 220px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      text-decoration: none;
      color: #1c7fb0;
      width: 260px;
      font-weight: bold;
      font-size: 18px;
      box-shadow: 2px 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;  
      height: 180px;
    }

    .entry-card:hover {
      transform: translateY(-6px);
    }

    .entry-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <h1>Welcome to My Diary</h1>

  <div class="entries">

    <a href="home.html" class="entry-card">
      <img src="assets/hotkid.jpg" alt="Fish icon">
      My Fish
    </a>

    <a href="food.html" class="entry-card">
      <img src="assets/girleat.jpg" alt="My photo">
      What I Eat
    </a>

    <a href="volunteer.html" class="entry-card">
      <img src="assets/shelter.jpeg" alt="shelter photo">
      Volunteer
    </a>

  </div>

</body>
</html>
